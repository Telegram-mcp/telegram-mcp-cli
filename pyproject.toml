[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp-cli"
version = "0.1.0"
description = "Command-line interface and bot automation controller for Telegram"
authors = [{ name = "Abhinav M", email = "fire162@users.noreply.github.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
tg-cli = "cli.main:main"
telegram-mcp-cli = "cli.main:main"
